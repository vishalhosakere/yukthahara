# Next.js 16 on Netlify's Next.js runtime, declared here and version-pinned in package.json rather than left to
# detection: this site was created before it became a Next.js app, so its UI settings have no runtime, and without the
# plugin Netlify would serve .next as plain files. Response headers live in next.config.ts.
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "24"
