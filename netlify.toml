# Next.js 16 build, served by Netlify's Next.js runtime. The runtime is pinned here rather than left to detection: this
# site was created before it became a Next.js app, so its UI settings have no runtime and would serve .next as plain files.
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Internal design tools: reachable by URL, never indexed.
[[headers]]
  for = "/lab/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
