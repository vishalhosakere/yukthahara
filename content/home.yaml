faq:
  eyebrow:
    en: Good to know
    kn: ತಿಳಿದಿರಲಿ
  heading:
    en: Questions, *answered.*
    kn: ಪ್ರಶ್ನೆಗಳಿಗೆ *ಉತ್ತರ.*
  items:
    - question:
        en: Is everything gluten-free?
        kn: ಎಲ್ಲವೂ ಗ್ಲುಟನ್-ಮುಕ್ತವೇ?
      answer:
        en: >-
          Our kitchen cooks without wheat. Every dish is built on the five
          siridhanya millets, which are naturally gluten-free. If you have
          coeliac disease or a severe allergy, tell us when you order.
        kn: >-
          ನಮ್ಮ ಅಡುಗೆಮನೆಯಲ್ಲಿ ಗೋಧಿ ಬಳಸುವುದಿಲ್ಲ. ಪ್ರತಿಯೊಂದು ಖಾದ್ಯವೂ ಸ್ವಾಭಾವಿಕವಾಗಿ
          ಗ್ಲುಟನ್-ಮುಕ್ತವಾದ ಪಂಚ ಸಿರಿಧಾನ್ಯಗಳಿಂದಲೇ ತಯಾರಾಗುತ್ತದೆ. ನಿಮಗೆ ಸೀಲಿಯಾಕ್
          ಕಾಯಿಲೆ ಅಥವಾ ತೀವ್ರ ಅಲರ್ಜಿ ಇದ್ದರೆ, ಆರ್ಡರ್ ಮಾಡುವಾಗ ತಿಳಿಸಿ.
    - question:
        en: Is the food vegetarian?
        kn: ಆಹಾರ ಸಸ್ಯಾಹಾರವೇ?
      answer:
        en: >-
          Yes, the kitchen is fully vegetarian. Some dishes use curd, ghee or
          milk; the ones marked vegan use none.
        kn: >-
          ಹೌದು, ನಮ್ಮ ಅಡುಗೆಮನೆ ಸಂಪೂರ್ಣ ಸಸ್ಯಾಹಾರಿ. ಕೆಲವು ಖಾದ್ಯಗಳಲ್ಲಿ ಮೊಸರು, ತುಪ್ಪ
          ಅಥವಾ ಹಾಲು ಇರುತ್ತದೆ; ‘ವೀಗನ್’ ಎಂದು ಗುರುತಿಸಿದವುಗಳಲ್ಲಿ ಇವು ಯಾವುದೂ ಇಲ್ಲ.
    - question:
        en: Do you use sugar?
        kn: ಸಕ್ಕರೆ ಬಳಸುತ್ತೀರಾ?
      answer:
        en: >-
          No refined sugar. Sweets and drinks are sweetened with palm jaggery,
          and coffee only if you ask.
        kn: >-
          ಸಂಸ್ಕರಿಸಿದ ಸಕ್ಕರೆ ಇಲ್ಲ. ಸಿಹಿ ಮತ್ತು ಪಾನೀಯಗಳಿಗೆ ತಾಳೆ ಬೆಲ್ಲ; ಕಾಫಿಗೆ ನೀವು
          ಕೇಳಿದರೆ ಮಾತ್ರ.
    - question:
        en: Are millets good if I have diabetes?
        kn: ಮಧುಮೇಹ ಇರುವವರಿಗೆ ಸಿರಿಧಾನ್ಯ ಒಳ್ಳೆಯದೇ?
      answer:
        en: >-
          Foxtail and barnyard are low-GI, and kodo and little still sit below
          polished rice, so they raise blood sugar more gently. They support a
          balanced diet but are not a treatment: keep to your doctor's advice.
        kn: >-
          ನವಣೆ ಮತ್ತು ಊದಲು ಕಡಿಮೆ-ಜಿಐ ಧಾನ್ಯಗಳು; ಹಾರಕ ಮತ್ತು ಸಾಮೆಯ ಜಿಐ ಕೂಡ ಪಾಲಿಶ್
          ಅಕ್ಕಿಗಿಂತ ಕಡಿಮೆ. ಹಾಗಾಗಿ ಇವು ರಕ್ತದ ಸಕ್ಕರೆಯನ್ನು ನಿಧಾನವಾಗಿ ಏರಿಸುತ್ತವೆ.
          ಇವು ಸಮತೋಲಿತ ಆಹಾರಕ್ಕೆ ಪೂರಕ, ಚಿಕಿತ್ಸೆಯಲ್ಲ: ನಿಮ್ಮ ವೈದ್ಯರ ಸಲಹೆಯನ್ನೇ
          ಪಾಲಿಸಿ.
    - question:
        en: Why only five millets? What about ragi?
        kn: ಐದೇ ಸಿರಿಧಾನ್ಯ ಏಕೆ? ರಾಗಿ ಏಕಿಲ್ಲ?
      answer:
        en: >-
          Ragi, jowar and bajra are good grains too. We keep to the five
          siridhanya, the ‘positive’ millets Dr. Khadar Vali champions for their
          higher fibre.
        kn: >-
          ರಾಗಿ, ಜೋಳ ಮತ್ತು ಸಜ್ಜೆ ಕೂಡ ಒಳ್ಳೆಯ ಧಾನ್ಯಗಳೇ. ಡಾ. ಖಾದರ್ ವಲಿ ಅವರು ಹೆಚ್ಚು
          ನಾರಿನ ಕಾರಣಕ್ಕೆ ಪ್ರತಿಪಾದಿಸುವ ‘ಧನಾತ್ಮಕ’ ಪಂಚ ಸಿರಿಧಾನ್ಯಗಳನ್ನು ಮಾತ್ರ ನಾವು
          ಬಳಸುತ್ತೇವೆ.
    - question:
        en: Can I book a table?
        kn: ಟೇಬಲ್ ಕಾಯ್ದಿರಿಸಬಹುದೇ?
      answer:
        en: Yes. Call us to book, or just walk in.
        kn: ಹೌದು. ಕರೆ ಮಾಡಿ ಕಾಯ್ದಿರಿಸಿ, ಅಥವಾ ನೇರವಾಗಿ ಬನ್ನಿ.
