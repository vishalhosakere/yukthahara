name:
  en: yuktaahara
  kn: ಯುಕ್ತಾಹಾರ
tagline:
  en: Eat right, eat millets.
  kn: ಸರಿಯಾಗಿ ತಿನ್ನಿ, ಸಿರಿಧಾನ್ಯ ತಿನ್ನಿ.
seoTitle:
  en: yuktaahara · millet kitchen in Mysuru
  kn: ಯುಕ್ತಾಹಾರ · ಮೈಸೂರಿನ ಸಿರಿಧಾನ್ಯ ಅಡುಗೆಮನೆ
seoDescription:
  en: >-
    A millet (siridhanya) kitchen in Kuvempunagar, Mysuru: tiffins, meals and sweets cooked from the five positive
    millets in wood-pressed oil, iron and clay.
  kn: >-
    ಮೈಸೂರಿನ ಕುವೆಂಪುನಗರದ ಸಿರಿಧಾನ್ಯ ಅಡುಗೆಮನೆ: ಪಂಚ ಸಿರಿಧಾನ್ಯಗಳಿಂದ, ಗಾಣದ ಎಣ್ಣೆಯಲ್ಲಿ, ಕಬ್ಬಿಣ ಮತ್ತು ಮಣ್ಣಿನ ಪಾತ್ರೆಗಳಲ್ಲಿ
    ತಯಾರಿಸಿದ ತಿಂಡಿ, ಊಟ ಮತ್ತು ಸಿಹಿ.
