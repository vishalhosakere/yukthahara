eyebrow:
  en: Sample menu
  kn: ಮಾದರಿ ಮೆನು
title:
  en: The menu
  kn: ಮೆನು
intro:
  en: Everything is cooked from the five siridhanya millets. Dishes and prices are placeholders for now.
  kn: ಎಲ್ಲ ಖಾದ್ಯಗಳನ್ನೂ ಪಂಚ ಸಿರಿಧಾನ್ಯಗಳಿಂದಲೇ ತಯಾರಿಸಲಾಗುತ್ತದೆ. ಖಾದ್ಯಗಳು ಮತ್ತು ಬೆಲೆಗಳು ಸದ್ಯಕ್ಕೆ ಮಾದರಿಗಾಗಿ ಮಾತ್ರ.
disclaimer:
  en: Dishes are prepared from minimally processed millets. Nutritional benefit depends on preparation. Millets support a balanced diet and are not a cure for any disease.
  kn: ಖಾದ್ಯಗಳನ್ನು ಕನಿಷ್ಠ ಸಂಸ್ಕರಿಸಿದ ಸಿರಿಧಾನ್ಯಗಳಿಂದ ತಯಾರಿಸಲಾಗುತ್ತದೆ. ಪೋಷಕಾಂಶದ ಲಾಭ ತಯಾರಿಸುವ ವಿಧಾನವನ್ನು ಅವಲಂಬಿಸಿದೆ. ಸಿರಿಧಾನ್ಯಗಳು ಸಮತೋಲಿತ ಆಹಾರಕ್ಕೆ ಪೂರಕ; ಯಾವುದೇ ರೋಗಕ್ಕೆ ಚಿಕಿತ್ಸೆಯಲ್ಲ.
