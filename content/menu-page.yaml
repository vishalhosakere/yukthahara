eyebrow:
  en: Sample menu
  kn: ಮಾದರಿ ಮೆನು
title:
  en: The menu
  kn: ಮೆನು
intro:
  en: Everything is cooked from the five siridhanya millets. Dishes and prices are placeholders for now.
  kn: ಎಲ್ಲವೂ ಪಂಚ ಸಿರಿಧಾನ್ಯಗಳಿಂದ ತಯಾರಿಸಲಾಗಿದೆ. ಖಾದ್ಯಗಳು ಮತ್ತು ಬೆಲೆಗಳು ಸದ್ಯಕ್ಕೆ ಮಾದರಿ.
disclaimer:
  en: Dishes are prepared from minimally processed millets. Nutritional benefit depends on preparation. Millets support a balanced diet and are not a cure for any disease.
  kn: ಖಾದ್ಯಗಳನ್ನು ಕನಿಷ್ಠ ಸಂಸ್ಕರಿಸಿದ ಸಿರಿಧಾನ್ಯಗಳಿಂದ ತಯಾರಿಸಲಾಗಿದೆ. ಪೋಷಕಾಂಶ ತಯಾರಿಕೆಯ ಮೇಲೆ ಅವಲಂಬಿತ. ಸಿರಿಧಾನ್ಯ ಸಮತೋಲಿತ ಆಹಾರಕ್ಕೆ ಪೂರಕ, ರೋಗಪರಿಹಾರವಲ್ಲ.
