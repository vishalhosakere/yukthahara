<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#ffffff"/>
  <defs>
    <radialGradient id="mound" cx="50%" cy="30%" r="75%">
      <stop offset="0" stop-color="#6a6a6a"/><stop offset="0.6" stop-color="#2a2a2a"/><stop offset="1" stop-color="#0e0e0e"/>
    </radialGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333"/><stop offset="1" stop-color="#000"/>
    </linearGradient>
  </defs>
  <!-- mound of grains -->
  <ellipse cx="100" cy="92" rx="64" ry="42" fill="url(#mound)"/>
  <!-- grain speckle for tonal variation -->
  <g fill="#7d7d7d">
    <circle cx="86" cy="80" r="3"/><circle cx="104" cy="74" r="2.4"/><circle cx="120" cy="86" r="3"/>
    <circle cx="72" cy="94" r="2.6"/><circle cx="132" cy="98" r="2.4"/><circle cx="100" cy="96" r="3.2"/>
  </g>
  <!-- bowl -->
  <path d="M28 98 A72 60 0 0 0 172 98 Z" fill="url(#bowl)"/>
  <ellipse cx="100" cy="98" rx="72" ry="14" fill="#1c1c1c"/>
</svg>
