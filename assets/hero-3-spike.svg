<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#ffffff"/>
  <defs>
    <linearGradient id="spk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f6f6f"/><stop offset="0.5" stop-color="#262626"/><stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
  </defs>
  <!-- millet spike -->
  <path d="M100 24 Q128 78 100 150 Q72 78 100 24 Z" fill="url(#spk)"/>
  <!-- seed texture -->
  <g fill="#8a8a8a" opacity="0.5">
    <circle cx="100" cy="52" r="3"/><circle cx="90" cy="70" r="3"/><circle cx="110" cy="72" r="3"/>
    <circle cx="96" cy="92" r="3.4"/><circle cx="108" cy="96" r="3"/><circle cx="100" cy="116" r="3.4"/>
  </g>
  <!-- stalk -->
  <rect x="98" y="150" width="4" height="30" fill="#1a1a1a"/>
</svg>
